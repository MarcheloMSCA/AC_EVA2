<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario y Almacenes - Seguridad LTDA</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="navbar">
        <h1>Módulo de Bodega y Logística</h1>
        <a href="index.html">Cerrar Sesión</a>
    </div>

    <div class="container">
        
        <div class="card">
            <h3>Ficha Técnica del Producto</h3>
            <form id="formProducto">
                <label for="prodCodigo">Código Alfanumérico (Hasta 20 car.):</label>
                <input type="text" id="prodCodigo" maxlength="20" placeholder="SKU-LIN-01" required>
                
                <label for="prodDesc">Descripción / Nombre:</label>
                <input type="text" id="prodDesc" required>
                
                <label for="prodStock">Stock Inicial:</label>
                <input type="number" id="prodStock" value="0" required>
                
                <label for="prodMinimo">Stock Mínimo de Seguridad:</label>
                <input type="number" id="prodMinimo" value="5" required>
                
                <button type="button" onclick="crearProductoBodega()">Dar de Alta Producto</button>
            </form>
            
            <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">
            <h3>Registrar Movimiento de Mercadería (HU-11)</h3>
            <form id="formMovimiento">
                <label for="movProd">Seleccionar Código de Artículo:</label>
                <!-- En esta fase el usuario debe tipear el código, en la Fase 3 lo automatizaremos -->
                <input type="text" id="movProd" placeholder="Ej: SKU-LIN-01" required>
                
                <label for="movTipo">Tipo de Transacción:</label>
                <select id="movTipo">
                    <option value="Entrada">Entrada (Abastecimiento)</option>
                    <option value="Salida">Salida (Despacho a sucursal)</option>
                </select>
                
                <label for="movCantidad">Cantidad:</label>
                <input type="number" id="movCantidad" value="1" required>
                
                <button type="button" onclick="ejecutarMovimientoBodega()" class="btn-warning">Procesar Tránsito</button>
            </form>
        </div>
    </div>

    
    <script src="../js/database.js"></script>
    <script src="../js/databaseM.js"></script>
</body>
</html>
