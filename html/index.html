<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ERP Seguridad LTDA - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="contenedor">
        <h2>Iniciar Sesión ERP</h2>
        <form id="formularioLogin">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" required>
            
            <label for="rol">Rol:</label>
            <select id="rol">
                <option value="admin">Administrador (RRHH)</option>
                <option value="bodega">Bodeguero (Inventario)</option>
            </select>

            <button type="button" onclick="iniciarSesion()">Ingresar</button>
        </form>
        <p id="mensajeError" class="error"></p>
    </div>
    <script src="../js/rrhh.js"></script>
</body>
</html>
